<div class="page-header">
  <h1>{{ id === undefined ? 'Novo assunto' : 'Editar assunto' }}</h1>
  <a class="btn btn-secondary" routerLink="/assuntos">Voltar</a>
</div>

<div *ngIf="erro" class="alert alert-error">{{ erro }}</div>

<form class="panel" [formGroup]="form" (ngSubmit)="salvar()">
  <div class="form-grid">
    <div class="form-field full">
      <label for="descricao">Descricao</label>
      <input id="descricao" type="text" formControlName="descricao" maxlength="20" />
      <span *ngIf="campoInvalido('descricao')" class="field-error">{{ mensagemCampo('descricao') }}</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" type="submit" [disabled]="salvando">Salvar</button>
    <a class="btn btn-secondary" routerLink="/assuntos">Voltar</a>
  </div>
</form>

<div class="page-header">
  <h1>Relatorio por autor</h1>
  <a class="btn btn-secondary" routerLink="/livros">Voltar</a>
</div>

<div *ngIf="erro" class="alert alert-error">{{ erro }}</div>

<section class="panel">
  <p *ngIf="carregando" class="muted">Carregando relatorio...</p>

  <div *ngIf="!carregando && itens.length > 0" class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Autor</th>
          <th>Total de livros</th>
          <th>Livros</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of itens">
          <td>{{ nomeAutor(item) }}</td>
          <td>{{ total(item) }}</td>
          <td>
            <span *ngIf="titulos(item).length === 0">-</span>
            <span *ngIf="titulos(item).length > 0">{{ titulos(item).join(', ') }}</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <p *ngIf="!carregando && itens.length === 0" class="muted">Nenhum dado encontrado para o relatorio.</p>
</section>
